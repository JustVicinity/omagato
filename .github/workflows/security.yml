name: Tests and dependency security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: |
          PIP_CONFIG_FILE=/dev/null python -m pip --isolated install \
            --index-url https://pypi.org/simple --require-hashes \
            --only-binary=:all: -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: bash -n install.sh uninstall.sh setup-usb-access.sh scripts/path-guards.sh
      - run: shellcheck install.sh uninstall.sh setup-usb-access.sh scripts/path-guards.sh bin/elgatoctl
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip --isolated install --index-url https://pypi.org/simple pip-audit==2.10.1
      - run: pip-audit --no-deps --disable-pip -r requirements.txt
